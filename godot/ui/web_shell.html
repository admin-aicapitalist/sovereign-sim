<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#141c18">
  <meta name="description" content="Raise a kingdom in the untamed borderlands. Build guilds, gather heroes, and begin your reign.">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html,body,canvas{margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden}
    body{background:#141c18;color:#ead8ad;touch-action:none;font:18px/1.5 Georgia,serif}
    canvas{display:block;outline:none;width:100%!important;height:100%!important}
    #status{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 44%,#30372a,#111a16 70%);text-align:center;padding:30px}
    #status:before{content:"";position:absolute;inset:18px;border:1px solid #8f784a;pointer-events:none}
    .crest{width:74px;height:84px;filter:drop-shadow(0 6px 15px #0005)}
    h1{font-size:clamp(26px,6vw,44px);font-weight:normal;letter-spacing:.12em;margin:0}
    .motto{font-style:italic;color:#bca77b;margin:-10px 0 14px}
    #status-progress{appearance:none;width:min(280px,75vw);height:7px;border:1px solid #9d824d;background:#232b21}
    #status-progress::-webkit-progress-bar{background:#232b21}
    #status-progress::-webkit-progress-value{background:linear-gradient(90deg,#9f7940,#e1c589)}
    #status-progress::-moz-progress-bar{background:#cfb174}
    .loading{font-size:13px;letter-spacing:.13em;color:#ac9c7a;text-transform:uppercase}
    #status-notice{display:none;max-width:580px;color:#efc6a4;font-size:16px;white-space:pre-line}
    noscript{position:fixed;inset:40% 20%;text-align:center;z-index:2}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" aria-label="Sovereign kingdom game">Your browser needs canvas support to enter the kingdom.</canvas>
  <noscript>Enable JavaScript to enter the kingdom.</noscript>
  <div id="status" role="status" aria-live="polite">
    <svg class="crest" viewBox="0 0 64 72" aria-hidden="true"><path d="M7 3h50v36c0 15-25 29-25 29S7 54 7 39z" fill="#742f29" stroke="#d9bc7f" stroke-width="2"/><path d="M11 7h42v31c0 12-21 25-21 25S11 50 11 38z" fill="none" stroke="#b29158"/><path d="M20 28l7 7 5-15 5 15 7-7-4 21H24zM24 54h16" fill="#e5c88e" stroke="#e5c88e" stroke-width="2"/><g fill="#e5c88e"><circle cx="20" cy="24" r="2"/><circle cx="32" cy="16" r="2"/><circle cx="44" cy="24" r="2"/></g></svg>
    <h1>SOVEREIGN</h1>
    <p class="motto">A crown. A kingdom. A little chaos.</p>
    <progress id="status-progress" aria-label="Loading the kingdom"></progress>
    <span class="loading">Preparing your kingdom</span>
    <div id="status-notice"></div>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const engine = new Engine(GODOT_CONFIG);
    const progress = document.getElementById('status-progress');
    function failure(error) {
      console.error(error);
      document.getElementById('status-notice').textContent = error.message || String(error);
      document.getElementById('status-notice').style.display = 'block';
      document.querySelector('.loading').textContent = 'The kingdom could not load';
      progress.style.display = 'none';
    }
    const missing = Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
    if (missing.length) failure(new Error('This browser is missing: '+missing.join(', ')));
    else engine.startGame({onProgress(current,total) {
      if (total>0) {progress.max=total;progress.value=current;}
      else progress.removeAttribute('value');
    }}).then(()=>document.getElementById('status').remove(),failure);
  </script>
</body>
</html>
