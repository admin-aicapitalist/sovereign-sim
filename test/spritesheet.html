<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sovereign — Sprite Gallery</title><style>body{background:#283f32;color:#e6dec3;font-family:Georgia,serif;padding:25px}h1{font-weight:normal}p,a{color:#b8c09a}#gallery{display:flex;flex-wrap:wrap;gap:14px}.sprite{width:210px;border:1px solid #b6a26b44;text-align:center;background:#84936530;border-radius:4px;padding:10px}.sprite canvas{width:190px;height:190px;object-fit:contain}.sprite small{display:block;font:11px Verdana;color:#c8caae}</style></head><body><h1>The Sovereign workshop</h1><p>Original imported and procedural artwork. <a href="?only=bld">Buildings</a> · <a href="?only=units">Units</a> · <a href="?only=misc">Scenery</a> · <a href="?">All</a> · <a href="../index.html">Play</a></p><div id="gallery"></div><script src="../js/util.js?v=0259a125e90b"></script><script src="../assets/art/palace/palace-sprite.js?v=a193d54d59be"></script><script src="../assets/art/buildings/buildings-sprites.js?v=1b7086a701fd"></script><script src="../assets/art/units/units-sprites.js?v=50b9ce0f461b"></script><script src="../assets/art/environment/environment-sprites.js?v=66582fe218fa"></script><script src="../js/data.js?v=3480df8d9553"></script><script src="../js/sprites.js?v=a26fb2a6567a"></script><script>(async function(){G.makeSprites();await G.loadSpriteAssets();const only=new URLSearchParams(location.search).get('only');for(const[key,value]of Object.entries(G.sprites)){if(only==='bld'&&!G.BUILDINGS[key]||only==='units'&&!key.startsWith('unit_')&&!key.startsWith('attack_')&&!key.startsWith('idle_')||only==='misc'&&(G.BUILDINGS[key]||key.startsWith('unit_')||key.startsWith('attack_')||key.startsWith('idle_')))continue;for(const[sprite,i]of(Array.isArray(value)?value:[value]).map((s,i)=>[s,i])){const card=document.createElement('div');card.className='sprite';let canvas=sprite.canvas;if(sprite.frame){canvas=document.createElement('canvas');canvas.width=sprite.frame[2];canvas.height=sprite.frame[3];G.paintSprite(canvas.getContext('2d'),sprite,0,0,canvas.width,canvas.height);}if(sprite.pixelArt)canvas.style.imageRendering='pixelated';card.appendChild(canvas);const label=document.createElement('small');label.textContent=key+(Array.isArray(value)?' · frame '+i:'');card.appendChild(label);document.getElementById('gallery').appendChild(card);}}})();</script></body></html>
